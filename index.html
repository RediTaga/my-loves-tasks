<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Love's Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: one wide centered column — header with progress ring, composer, filter bar, draggable task list. */
:root {
  --bg: #fff4f7;
  --surface: #ffffff;
  --ink: #4a2a38;
  --muted: #9b7585;
  --line: #f6dce4;
  --accent: #e2557f;
  --accent-soft: #ffe7ef;
  --on-accent: #ffffff;
  --high: #e5484d;
  --med: #e8a317;
  --low: #2fa36b;
  --shadow: 0 1px 2px rgba(226,85,127,.06), 0 10px 30px rgba(226,85,127,.10);
  --lift: 0 16px 36px rgba(226,85,127,.25);
  /* Rose background; crabs and hearts are drawn by script into #pattern. */
  --page-bg: linear-gradient(165deg, #fff6f8 0%, #ffe9ef 50%, #ffdde7 100%);
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* Crab-and-heart layer. Shapes that would sit behind the title or the ring are left out. */
#pattern { position: fixed; inset: 0; z-index: -1; pointer-events: none; width: 100%; height: 100%; }
html, body { margin: 0; }
body {
  background: var(--page-bg); background-attachment: fixed; color: var(--ink);
  background-color: #fff6f8;
  font: 17px/1.5 var(--font-body);
  min-height: 100%;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 72px; display: grid; gap: 24px; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
h1 { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 52px; color: var(--accent); line-height: 1.05; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; font-size: 17px; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }

.composer {
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  box-shadow: var(--shadow); padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.composer input[type="text"] {
  flex: 1 1 260px; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 19px; padding: 12px 12px; outline: none;
}
.chip-group { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.chip-group button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 500;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center;
}
.chip-group button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.high { background: var(--high); } .dot.med { background: var(--med); } .dot.low { background: var(--low); }
.btn {
  border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
  padding: 12px 22px; cursor: pointer; transition: transform .1s ease, opacity .2s;
}
.btn:hover { opacity: .92; } .btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }

.bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.tabs button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 16px; font-weight: 500;
  padding: 8px 18px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.hint { color: var(--muted); font-size: 14px; }
.right { display: flex; align-items: center; gap: 16px; }
.link { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; padding: 6px 4px; }
.link:hover { color: var(--accent); }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li.task {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center;
  padding: 16px 16px 16px 10px; position: relative; overflow: hidden;
  transition: box-shadow .15s ease, transform .15s ease;
}
li.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc, transparent); }
li.task[data-p="high"] { --pc: var(--high); } li.task[data-p="med"] { --pc: var(--med); } li.task[data-p="low"] { --pc: var(--low); }
li.task.new { animation: pop .22s ease; }
li.task.dragging { box-shadow: var(--lift); transform: scale(1.01); z-index: 2; border-color: var(--accent); transition: none; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.handle {
  border: 0; background: transparent; color: var(--muted); cursor: grab; touch-action: none;
  width: 28px; height: 36px; display: grid; place-items: center; border-radius: 8px; padding: 0; opacity: .55;
}
.handle:hover, .handle:focus-visible { opacity: 1; background: var(--bg); }
.check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  cursor: pointer; display: grid; place-items: center; padding: 0; transition: all .15s ease;
}
.check:hover { border-color: var(--accent); }
.check svg { opacity: 0; transition: opacity .15s; }
li.done .check { background: var(--accent); border-color: var(--accent); }
li.done .check svg { opacity: 1; }
.body { min-width: 0; }
.title { overflow-wrap: anywhere; cursor: text; font-size: 18px; }
li.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
.edit { width: 100%; font: inherit; font-size: 18px; color: var(--ink); background: var(--bg); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; outline: none; }
.del {
  border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center; opacity: 0; transition: opacity .15s, background .15s;
}
li.task:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { background: var(--bg); color: var(--high); }
@media (hover: none) { .del { opacity: 1; } }

.empty {
  text-align: center; color: var(--muted); padding: 56px 16px; border: 1.5px dashed var(--line); border-radius: 16px;
}
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 22px; margin-bottom: 4px; }
.status { font-size: 14px; color: var(--muted); text-align: center; min-height: 20px; }
.sr { position: absolute; left: -9999px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 560px) {
  body { font-size: 16px; }
  .wrap { padding: 32px 16px 56px; gap: 18px; }
  h1 { font-size: 32px; } .ring { width: 60px; height: 60px; } .ring span { font-size: 14px; }
  .hint { display: none; }
  li.task { padding: 12px 12px 12px 6px; gap: 10px; }
}
</style>
</head>
<body>
<svg id="pattern" aria-hidden="true">
  <defs>
    <g id="crab" stroke-linecap="round">
      <g stroke-width="3" fill="none"><path d="M-16 4 l-12 6 l-4 8"/><path d="M-14 10 l-10 8 l-2 8"/><path d="M-10 14 l-6 10 l2 7"/><path d="M16 4 l12 6 l4 8"/><path d="M14 10 l10 8 l2 8"/><path d="M10 14 l6 10 l-2 7"/><path d="M-14 -6 q-10 -8 -14 -18"/><path d="M14 -6 q10 -8 14 -18"/><path d="M-5 -12 l-2 -8"/><path d="M5 -12 l2 -8"/></g>
      <ellipse cx="0" cy="2" rx="20" ry="14" stroke="none"/>
      <path stroke="none" d="M-28 -24 a8 8 0 1 1 -2 14 l6 -6 z"/><path stroke="none" d="M28 -24 a8 8 0 1 0 2 14 l-6 -6 z"/>
      <circle cx="-7" cy="-21" r="3" stroke="none"/><circle cx="7" cy="-21" r="3" stroke="none"/>
    </g>
    <path id="heart" d="M0 6 C-2 3 -10 -1 -10 -6 C-10 -10 -6 -12 -3.5 -12 C-1.8 -12 -0.6 -11 0 -9.6 C0.6 -11 1.8 -12 3.5 -12 C6 -12 10 -10 10 -6 C10 -1 2 3 0 6 Z"/>
  </defs>
  <g id="shapes"></g>
</svg>
<main class="wrap">
  <header>
    <div>
      <h1 id="greeting">My Love's Tasks</h1>
      <div class="sub" id="summary"></div>
    </div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="27" fill="none" stroke-width="6"></circle>
        <circle class="bar" id="ringBar" cx="32" cy="32" r="27" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"></circle>
      </svg>
      <span id="ringPct">0%</span>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <label for="newTitle" class="sr">New task</label>
    <input type="text" id="newTitle" placeholder="Add a task, then press Enter" maxlength="200">
    <div class="chip-group" role="group" aria-label="Priority" id="prio">
      <button type="button" data-p="low" aria-pressed="false"><i class="dot low"></i>Low</button>
      <button type="button" data-p="med" aria-pressed="true"><i class="dot med"></i>Medium</button>
      <button type="button" data-p="high" aria-pressed="false"><i class="dot high"></i>High</button>
    </div>
    <button class="btn" id="addBtn" type="submit" disabled>Add</button>
  </form>

  <div class="bar-row">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-f="all" aria-selected="true">All <span id="cAll">0</span></button>
      <button role="tab" data-f="active" aria-selected="false">Active <span id="cActive">0</span></button>
      <button role="tab" data-f="done" aria-selected="false">Done <span id="cDone">0</span></button>
    </div>
    <div class="right">
      <span class="hint">Drag the handle to reorder</span>
      <button class="link" id="clearDone" type="button">Clear completed</button>
    </div>
  </div>

  <ul id="list" aria-live="polite"></ul>
  <div class="status" id="status"></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LS_KEY = "todo-pages-tasks-v1";
  let tasks = [];          // {id, title, done, priority, order, created}
  let filter = "all";
  let priority = "med";
  let justAdded = null;
  let dragging = false;

  // ---------- crabs and hearts: tiled, but none behind the title or the ring ----------
  const TILE = 480;
  const SHAPES = [ // [symbol, x, y, rotation, scale, color, radius]
    ["crab", 110, 120, -12, 2.0, "#fbd0db", 80],
    ["crab", 350, 350, 14, 1.8, "#f9c6d3", 72],
    ["heart", 360, 110, 14, 4.2, "#fcd3dd", 54],
    ["heart", 120, 360, -12, 3.8, "#f9c0ce", 50],
  ];
  function keepOut() {
    const rects = [];
    const h1 = document.getElementById("greeting");
    const range = document.createRange(); range.selectNodeContents(h1);
    const t = range.getBoundingClientRect(), sub = document.getElementById("summary").getBoundingClientRect();
    rects.push({ l: Math.min(t.left, sub.left), t: t.top, r: Math.max(t.right, sub.right), b: sub.bottom });
    const ring = document.querySelector(".ring").getBoundingClientRect();
    rects.push({ l: ring.left, t: ring.top, r: ring.right, b: ring.bottom });
    return rects;
  }
  function drawPattern() {
    const w = window.innerWidth, hgt = window.innerHeight, pad = 16;
    const rects = keepOut();
    let out = "";
    for (let ty = 0; ty < hgt + TILE; ty += TILE) {
      for (let tx = 0; tx < w + TILE; tx += TILE) {
        for (const [id, x, y, rot, sc, col, rad] of SHAPES) {
          const cx = tx + x, cy = ty + y;
          const blocked = rects.some(q => {
            const nx = Math.max(q.l, Math.min(cx, q.r)), ny = Math.max(q.t, Math.min(cy, q.b));
            return Math.hypot(cx - nx, cy - ny) < rad + pad;
          });
          if (!blocked) out += `<use href="#${id}" fill="${col}" stroke="${col}" transform="translate(${cx} ${cy}) rotate(${rot}) scale(${sc})"/>`;
        }
      }
    }
    document.getElementById("shapes").innerHTML = out;
  }
  let drawQueued = false;
  const queueDraw = () => { if (drawQueued) return; drawQueued = true; requestAnimationFrame(() => { drawQueued = false; drawPattern(); }); };
  window.addEventListener("scroll", queueDraw, { passive: true });
  window.addEventListener("resize", queueDraw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueDraw);
  queueDraw();

  // ---------- helpers ----------
  const PRANK = { high: 0, med: 1, low: 2 };
  const ord = (t) => (typeof t.order === "number" ? t.order : t.created || 0);
  const sorted = () => tasks.slice().sort((a, b) => ord(a) - ord(b) || (a.created - b.created));
  function clean(t) { return { title: t.title, done: !!t.done, priority: t.priority, order: ord(t), created: t.created }; }
  function setStatus(s) { $("status").textContent = s; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // ---------- local fallback ----------
  function loadLocal() { try { tasks = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { tasks = []; } }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); } catch {} }
  loadLocal();
  render();

  function persist() { saveLocal(); }

  // ---------- actions ----------
  $("newTitle").addEventListener("input", (e) => { $("addBtn").disabled = !e.target.value.trim(); });
  $("prio").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    priority = b.dataset.p;
    [...$("prio").children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("newTitle").value.trim(); if (!title) return;
    // Place the new task at the end of its priority group (High, then Medium, then Low).
    const list = sorted();
    const idx = list.findIndex(x => (PRANK[x.priority] ?? 1) > PRANK[priority]);
    let order;
    if (!list.length) order = 1;
    else if (idx === -1) order = ord(list[list.length - 1]) + 1;
    else if (idx === 0) order = ord(list[0]) - 1;
    else order = (ord(list[idx - 1]) + ord(list[idx])) / 2;
    const t = { id: uid(), title, done: false, priority, order, created: Date.now() };
    tasks.push(t); justAdded = t.id;
    $("newTitle").value = ""; $("addBtn").disabled = true;
    if (filter === "done") setFilter("all");
    render(); persist(t);
  });
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setFilter(b.dataset.f); });
  function setFilter(f) {
    filter = f;
    [...$("tabs").children].forEach(x => x.setAttribute("aria-selected", String(x.dataset.f === f)));
    render();
  }
  $("clearDone").addEventListener("click", () => {
    const gone = tasks.filter(t => t.done);
    tasks = tasks.filter(t => !t.done);
    render();
    gone.forEach(t => persist(t, true));
  });

  $("list").addEventListener("click", (e) => {
    const li = e.target.closest("li.task"); if (!li) return;
    const t = tasks.find(x => x.id === li.dataset.id); if (!t) return;
    if (e.target.closest(".check")) { t.done = !t.done; render(); persist(t); }
    else if (e.target.closest(".del")) { tasks = tasks.filter(x => x !== t); render(); persist(t, true); }
  });
  $("list").addEventListener("dblclick", (e) => {
    const title = e.target.closest(".title"); if (!title) return;
    startEdit(title.closest("li.task"));
  });
  $("list").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("title")) { e.preventDefault(); startEdit(e.target.closest("li.task")); }
    // Keyboard reordering: arrow keys on the drag handle.
    if (e.target.classList.contains("handle") && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      const li = e.target.closest("li.task");
      const sib = e.key === "ArrowUp" ? li.previousElementSibling : li.nextElementSibling;
      if (!sib || !sib.classList.contains("task")) return;
      if (e.key === "ArrowUp") sib.before(li); else sib.after(li);
      commitOrder(li.dataset.id);
      const h = $("list").querySelector(`li[data-id="${CSS.escape(li.dataset.id)}"] .handle`);
      if (h) h.focus();
    }
  });

  function startEdit(li) {
    const t = tasks.find(x => x.id === li.dataset.id); if (!t) return;
    const titleEl = li.querySelector(".title");
    const input = document.createElement("input");
    input.className = "edit"; input.value = t.title; input.maxLength = 200; input.id = "edit-" + t.id;
    input.setAttribute("aria-label", "Edit task");
    titleEl.replaceWith(input); input.focus(); input.select();
    let finished = false;
    const finish = (save) => {
      if (finished) return; finished = true;
      const v = input.value.trim();
      if (save && v && v !== t.title) { t.title = v; persist(t); }
      render();
    };
    input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); });
    input.addEventListener("blur", () => finish(true));
  }

  // ---------- drag and drop (pointer events: mouse, touch, pen) ----------
  $("list").addEventListener("pointerdown", (e) => {
    const handle = e.target.closest(".handle"); if (!handle || e.button > 0) return;
    e.preventDefault();
    const li = handle.closest("li.task");
    const list = $("list");
    const startY = e.clientY;
    const rect0 = li.getBoundingClientRect();
    let offset = 0;
    dragging = true;
    li.classList.add("dragging");
    document.body.classList.add("is-dragging");

    const move = (ev) => {
      const y = ev.clientY;
      // Swap with neighbours as the pointer crosses their midpoints.
      let sib = li.previousElementSibling;
      while (sib && sib.classList.contains("task")) {
        const r = sib.getBoundingClientRect();
        if (y < r.top + r.height / 2) { sib.before(li); sib = li.previousElementSibling; } else break;
      }
      sib = li.nextElementSibling;
      while (sib && sib.classList.contains("task")) {
        const r = sib.getBoundingClientRect();
        if (y > r.top + r.height / 2) { sib.after(li); sib = li.nextElementSibling; } else break;
      }
      // Keep the card under the pointer.
      li.style.transform = "";
      const r = li.getBoundingClientRect();
      offset = y - (startY - rect0.top) - r.top;
      li.style.transform = `translateY(${offset}px) scale(1.01)`;
      // Auto-scroll near viewport edges.
      if (y < 60) window.scrollBy(0, -12); else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      li.classList.remove("dragging");
      li.style.transform = "";
      document.body.classList.remove("is-dragging");
      dragging = false;
      commitOrder();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });

  // Read the visible order from the DOM and write it back into the full list.
  function commitOrder() {
    const visibleIds = [...$("list").querySelectorAll("li.task")].map(li => li.dataset.id);
    const full = sorted();
    const visibleSet = new Set(visibleIds);
    let k = 0;
    const byId = new Map(tasks.map(t => [t.id, t]));
    const next = full.map(t => visibleSet.has(t.id) ? byId.get(visibleIds[k++]) : t);
    const changed = [];
    next.forEach((t, i) => { if (t.order !== i + 1) { t.order = i + 1; changed.push(t); } });
    if (!changed.length) return;
    saveLocal();
    changed.forEach(t => persist(t));
  }

  // ---------- render ----------
  function render() {
    const total = tasks.length, done = tasks.filter(t => t.done).length, active = total - done;
    $("cAll").textContent = total; $("cActive").textContent = active; $("cDone").textContent = done;
    $("summary").textContent = total === 0 ? "Nothing on your list yet."
      : active === 0 ? "All done. Nice work." : `${active} task${active === 1 ? "" : "s"} left to do`;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("ringPct").textContent = pct + "%";
    $("ringBar").setAttribute("stroke-dashoffset", String(169.6 * (1 - pct / 100)));
    $("clearDone").style.visibility = done ? "visible" : "hidden";

    const view = sorted().filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    if (!view.length) {
      const msg = filter === "done" ? ["No completed tasks", "Tick a task off and it shows up here."]
        : filter === "active" && total ? ["You're all caught up", "Every task on your list is done."]
        : ["Your list is empty", "Type a task above and press Enter to add it."];
      $("list").innerHTML = `<li class="empty"><strong>${msg[0]}</strong>${msg[1]}</li>`;
      return;
    }
    $("list").innerHTML = view.map(t => {
      const pLabel = { high: "High", med: "Medium", low: "Low" }[t.priority] || "Medium";
      return `<li class="task${t.done ? " done" : ""}${t.id === justAdded ? " new" : ""}" data-id="${esc(t.id)}" data-p="${esc(t.priority)}">
        <button class="handle" type="button" aria-label="Reorder ${esc(t.title)}. Drag, or use the up and down arrow keys.">
          <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/></svg>
        </button>
        <button class="check" type="button" aria-label="${t.done ? "Mark as not done" : "Mark as done"}: ${esc(t.title)}">
          <svg width="14" height="14" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="body">
          <div class="title" tabindex="0" title="Double-click to edit">${esc(t.title)}</div>
          <div class="meta">${pLabel} priority</div>
        </div>
        <button class="del" type="button" aria-label="Delete task: ${esc(t.title)}">
          <svg width="18" height="18" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </li>`;
    }).join("");
    justAdded = null;
  }
})();
</script>
</body>
</html>
